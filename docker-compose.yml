services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: visionamos
      POSTGRES_PASSWORD: visionamos
      POSTGRES_DB: visionamos
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U visionamos']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
